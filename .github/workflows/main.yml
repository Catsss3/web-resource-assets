name: UpdateConfigs
on:
  workflow_dispatch:
  schedule:
    - cron: "30 4,8,12,16,20 * * *"
jobs:
  UpdateConfigs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install Dependencies
        working-directory: ./core-parser-ts
        run: bun install
      - name: Run index.ts
        working-directory: ./core-parser-ts
        run: bun index.ts
      - name: Commit Changes
        run: |
          git config --local user.name "Stella-Blondie"
          git config --local user.email "stella@blondie.ai"
          git add core-parser-ts/category/*
          git add core-parser-ts/BadChannels.txt
          git commit -m "💅 Stella: Syncing Trophy Configs ✨" || exit 0
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}